<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 24–40px 像素对齐简化图：保留一道波纹，线宽按整像素对齐 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#1A43BF"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="13.5" cy="13.5" r="6"/></clipPath>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>
  <circle cx="13.5" cy="13.5" r="6" fill="#1B4FD0" opacity="0.6"/>
  <path clip-path="url(#lens)" d="M6.5 14.5 q2.4 -2.2 4.8 0 t4.8 0 t4.8 0" fill="none" stroke="#9BE6FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="13.5" cy="13.5" r="6.6" fill="none" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="18.6" y1="18.6" x2="24" y2="24" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
</svg>
