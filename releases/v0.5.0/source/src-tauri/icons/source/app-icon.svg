<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- FindFlow 应用图标主图（方案 A · 流光透镜）：48px 及以上尺寸由本图缩放 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#1437A8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="452" cy="452" r="196"/></clipPath>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="220"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#061A5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <path clip-path="url(#tile)" d="M0 700 C 300 600, 600 820, 1024 630 V 1024 H 0 Z" fill="#FFFFFF" opacity="0.07"/>
  <g filter="url(#shadow)">
    <circle cx="452" cy="452" r="196" fill="#1B4FD0" opacity="0.55"/>
    <g clip-path="url(#lens)">
      <path d="M230 470 C 320 400, 400 540, 490 470 S 640 400, 700 460" fill="none" stroke="url(#wave)" stroke-width="44" stroke-linecap="round"/>
      <path d="M230 560 C 320 490, 400 630, 490 560 S 640 490, 700 550" fill="none" stroke="#8FE3FF" stroke-width="30" stroke-linecap="round" opacity="0.75"/>
      <path d="M230 385 C 320 315, 400 455, 490 385 S 640 315, 700 375" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.45"/>
    </g>
    <circle cx="452" cy="452" r="196" fill="none" stroke="#FFFFFF" stroke-width="84"/>
    <line x1="610" y1="610" x2="778" y2="778" stroke="#FFFFFF" stroke-width="112" stroke-linecap="round"/>
  </g>
</svg>
