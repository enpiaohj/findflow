[package]
name = "findflow"
version = "0.2.0"
description = "FindFlow —— Windows 本地优先的极速文件搜索与轻量文件处理工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "findflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
